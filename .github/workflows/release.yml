name: ZCode Release

on:
  workflow_dispatch:
    inputs:
      versions:
        description: 'Versions to release (space-separated, e.g. "3.15.1 3.16.2"). "all" = every version missing a release. Empty = latest only.'
        required: false
        default: ''
  schedule:
    - cron: '30 0 * * *'

jobs:
  check-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve target versions
        id: resolve
        run: |
          input="${{ inputs.versions }}"
          if [ "$input" = "all" ]; then
            targets=$(python3 scripts/zcode_release.py versions)
          elif [ -n "$input" ]; then
            targets="$input"
          else
            targets=$(python3 scripts/zcode_release.py latest)
          fi
          echo "Target versions: $targets"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

      - name: Release missing versions
        run: |
          released=""
          for version in ${{ steps.resolve.outputs.targets }}; do
            if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "v$version already released, skipping"
              continue
            fi
            python3 scripts/zcode_release.py prepare "$version"
            gh release create "v$version" \
              --repo "$GITHUB_REPOSITORY" \
              --title "ZCode $version" \
              --notes-file release-notes.md \
              "ZCode-$version-x86_64.AppImage" \
              "ZCode-$version-aarch64.AppImage" \
              SHA512SUMS
            echo "Released v$version"
            released="$released $version"
            rm -f ZCode-*.AppImage SHA512SUMS release-notes.md
          done
          echo "released=$released" >> "$GITHUB_ENV"

      - name: Set last release and run timestamps
        id: set-timestamps
        run: |
          current_timestamp=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          if [ -n "${{ env.released }}" ]; then
            release_timestamp=$current_timestamp
          else
            release_timestamp=$(grep -oP '(?<=\*\*⏳ Last Released On\*\*: ).*' README.md)
          fi

          echo "last_run=$current_timestamp" >> "$GITHUB_ENV"
          echo "last_release=$release_timestamp" >> "$GITHUB_ENV"

      - name: Update README with timestamps
        run: |
          sed -i '/^## 📅 Release Status/,/^$/d' README.md

          echo -e "## 📅 Release Status" >> README.md
          echo -e "- **⏳ Last Released On**: ${{ env.last_release }}" >> README.md
          echo -e "- **🔄 Last Run**: ${{ env.last_run }}" >> README.md

      - name: Commit and push README update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "README unchanged, skipping commit."
          else
            git add README.md
            git commit -m "📝 Update timestamps in README [workflow]"
            git push
          fi
